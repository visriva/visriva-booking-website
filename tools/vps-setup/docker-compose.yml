version: '3.8'

services:
  evolution-api:
    image: atacama/evolution-api:v1.8.2
    container_name: visriva_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=https://api.visriva.com
      - API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_TYPE=apikey
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=local
      - DATABASE_CONNECTION_URI=redis://redis:6379/0
      - LOG_LEVEL=ERROR,WARN,INFO
      - DELAY_BY_KEY=true
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: visriva_redis
    restart: always
    ports:
      - "6379:6379"
